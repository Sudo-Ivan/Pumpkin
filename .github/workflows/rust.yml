name: Cargo Build, Test, and Linting

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      rust_toolchain_version:
        description: Rust toolchain version to use
        required: false
        default: stable
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI_RUST_TOOLCHAIN_VER: ${{ inputs.rust_toolchain_version || 'stable' }}
  RUSTFLAGS: "-Dwarnings"

jobs:
  prepare:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      affected_packages: ${{ steps.plan.outputs.affected_packages }}
      has_code: ${{ steps.plan.outputs.has_code }}
      run_full: ${{ steps.plan.outputs.run_full }}
      should_check_wit: ${{ steps.plan.outputs.should_check_wit }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Select affected packages
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python .github/scripts/ci_packages.py plan
          --event "$EVENT_NAME"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --output "$GITHUB_OUTPUT"

  format:
    name: Check formatting
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  machete:
    name: Detect unused dependencies
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  clippy:
    name: Run lints
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Clippy affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo clippy --all-targets --all-features

  clippy_release:
    name: Run release lints
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --release --all-targets --all-features

  check_wit:
    name: Test `pumpkin-plugin-wit` against `wit-bindgen`
    needs: prepare
    if: needs.prepare.outputs.should_check_wit == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: "crates/pumpkin-plugin-wit"
      - uses: bytecodealliance/actions/wit-bindgen/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      - run: wit-bindgen rust crates/pumpkin-plugin-wit/v0.1
      - run: wit-bindgen rust crates/pumpkin-plugin-wit/v0.2

  test:
    name: Test (${{ matrix.name }})
    needs: [prepare, format, machete, clippy, check_wit]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.format.result == 'success' &&
      needs.machete.result == 'success' &&
      needs.clippy.result == 'success' &&
      (needs.check_wit.result == 'success' || needs.check_wit.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Test affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo nextest run --verbose --no-tests=pass
      - name: Test affected package documentation
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo test --doc --verbose

  test_android:
    name: Test on Android AArch64
    needs: [prepare, format, machete, clippy, check_wit]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.run_full == 'true' &&
      needs.format.result == 'success' &&
      needs.machete.result == 'success' &&
      needs.clippy.result == 'success' &&
      (needs.check_wit.result == 'success' || needs.check_wit.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: android-debug-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install cargo-ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator and test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CARGO_NDK_PLATFORM: 24
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cargo ndk-test -t arm64-v8a

  build_pull_request:
    name: Build affected packages
    needs: [prepare, test]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.test.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-26.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS
            os: macos-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Build affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo build --verbose

  build_android_pull_request:
    name: Build affected packages for Android AArch64
    needs: [prepare, test, test_android]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.test.result == 'success' &&
      (needs.test_android.result == 'success' ||
      needs.test_android.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: android-debug-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install cargo-ndk
      - name: Build affected packages
        env:
          CARGO_NDK_PLATFORM: 24
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo ndk -t arm64-v8a build --locked

  build_release:
    name: Build project in release
    needs: [prepare, clippy_release, test, test_android]
    # Fork: skip heavy release-artifact builds on every master push (cold musl/ndk builds
    # were getting runner shutdown/exit 143). Use release.yml on tags, or dispatch this workflow.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.outputs.run_full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-26.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install musl-tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release
        shell: bash
        run: |
          cargo build --verbose --release
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "$RUNNER_ARCH" == "X64" ]; then
              TARGET="x86_64-unknown-linux-musl"
            elif [ "$RUNNER_ARCH" == "ARM64" ]; then
              TARGET="aarch64-unknown-linux-musl"
            fi
            rustup target add "$TARGET"
            cargo build --verbose --release --target "$TARGET"
          fi
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then EXT=".exe"; fi
          cp "target/release/pumpkin${EXT}" "dist/pumpkin-${RUNNER_ARCH}-${RUNNER_OS}${EXT}"
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "$RUNNER_ARCH" == "X64" ]; then
              TARGET="x86_64-unknown-linux-musl"
            elif [ "$RUNNER_ARCH" == "ARM64" ]; then
              TARGET="aarch64-unknown-linux-musl"
            fi
            cp "target/${TARGET}/release/pumpkin" "dist/pumpkin-${RUNNER_ARCH}-${RUNNER_OS}-musl"
          fi
      - name: Export executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pumpkin-${{ runner.arch }}-${{ runner.os }}
          compression-level: 9
          path: dist/pumpkin-*

  build_android_release:
    name: Build project in release for Android AArch64
    needs: [prepare, clippy_release, test, test_android]
    # Fork: same as build_release — tag via release.yml instead of every master push.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        shell: bash
        run: rustup update "$CI_RUST_TOOLCHAIN_VER" && rustup default "$CI_RUST_TOOLCHAIN_VER"
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-ndk
      - name: Build release with cargo ndk
        env:
          CARGO_NDK_PLATFORM: 24
        run: cargo ndk -t arm64-v8a build --release --locked
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/aarch64-linux-android/release/pumpkin" "dist/pumpkin-aarch64-android"
      - name: Export executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pumpkin-aarch64-android
          compression-level: 9
          path: dist/pumpkin-aarch64-android

  draft_release:
    name: Draft nightly release
    permissions:
      contents: write
    needs: [build_release, build_android_release]
    runs-on: ubuntu-latest
    # Fork: nightly drafting only when this workflow is manually dispatched.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download prebuilt binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "**/pumpkin-*"
          path: dist/
          merge-multiple: true
      - name: Generate release notes
        run: |
          tree dist/
          echo "From commit: $(git rev-parse --short HEAD)" > dist/RELEASE.md
          echo "Generated on: $(date -u +"%Y-%m-%d %H:%M") UTC" >> dist/RELEASE.md
          cat dist/RELEASE.md
      - name: Update the nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag --force nightly
          git push --force origin tag nightly
      - name: Draft a nightly GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes || true
          fi
          gh release create nightly \
            --prerelease \
            --title "Nightly Build" \
            --notes-file dist/RELEASE.md \
            dist/pumpkin*
