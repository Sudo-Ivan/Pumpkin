name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "*"
      - "!nightly"
      - "!nightly*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag name (optional, defaults to Cargo.toml version)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-26.04-arm,
            windows-latest,
            windows-11-arm,
            macos-latest,
          ]
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"

      # lookup-only: avoid cache poisoning when publishing release artifacts
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - name: Install musl-tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release
        shell: bash
        run: |
          cargo build --verbose --release
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "$RUNNER_ARCH" == "X64" ]; then
              TARGET="x86_64-unknown-linux-musl"
            elif [ "$RUNNER_ARCH" == "ARM64" ]; then
              TARGET="aarch64-unknown-linux-musl"
            fi
            rustup target add "$TARGET"
            cargo build --verbose --release --target "$TARGET"
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then EXT=".exe"; fi
          cp "target/release/pumpkin${EXT}" "dist/pumpkin-${RUNNER_ARCH}-${RUNNER_OS}${EXT}"
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "$RUNNER_ARCH" == "X64" ]; then
              TARGET="x86_64-unknown-linux-musl"
            elif [ "$RUNNER_ARCH" == "ARM64" ]; then
              TARGET="aarch64-unknown-linux-musl"
            fi
            cp "target/${TARGET}/release/pumpkin" "dist/pumpkin-${RUNNER_ARCH}-${RUNNER_OS}-musl"
          fi

      - name: Export executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pumpkin-${{ runner.arch }}-${{ runner.os }}
          compression-level: 9
          path: dist/pumpkin-*

  build_android_release:
    name: Build project in release for Android (AArch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Rust toolchain
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true
      - name: Build Release with cargo ndk
        env:
          CARGO_NDK_PLATFORM: 24
        run: cargo ndk -t arm64-v8a build --release --locked
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/aarch64-linux-android/release/pumpkin" "dist/pumpkin-aarch64-android"
      - name: Export executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pumpkin-aarch64-android
          compression-level: 9
          path: dist/pumpkin-aarch64-android

  publish_release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [build_release, build_android_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Determine tag name
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" == "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
            TAG="${VERSION}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined release tag: ${TAG}"

      - name: Download prebuilt binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "pumpkin-*"
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum pumpkin-* > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            dist/pumpkin* \
            dist/checksums.sha256
